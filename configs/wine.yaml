name: wine
experiment: wine-quality
model_name: wine-quality-classifier
task: classification
metric: f1
data:
  train: data/processed/train.csv
  test: data/processed/test.csv
  target: good
candidates:
  - type: logreg
    grid:
      C: [0.01, 0.1, 1, 10]
  - type: random_forest
    grid:
      n_estimators: [50, 100, 200]
      max_depth: [5, 10, null]