name: spam
experiment: spam-detector
model_name: spam-detector
task: classification
metric: f1
margin: 0.005
data:
  train: data/processed/spam_train.csv
  test: data/processed/spam_test.csv
  target: label
  text_column: text
candidates:
  - type: tfidf_nb
    grid:
      alpha: [0.01, 0.05, 0.1, 0.5, 1.0]
  - type: tfidf_logreg
    grid:
      C: [0.1, 1, 10, 100, 1000]